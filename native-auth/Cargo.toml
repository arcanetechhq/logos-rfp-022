[dev-dependencies]
lb-groth16 = { package = "logos-blockchain-groth16", path = "../../../work/upstream/blockchain/zk/groth16" }
lb-time = { package = "logos-blockchain-time", path = "../../../work/upstream/blockchain/time" }
lb-utils = { package = "logos-blockchain-utils", path = "../../../work/upstream/blockchain/utils" }
time = "0.3"
[profile.dev]
debug = 0
