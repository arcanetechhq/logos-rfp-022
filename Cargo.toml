[package]
name = "reverse-settlement-prototype"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
acceptance-core = { path = "acceptance-core", features = ["host"] }
reverse-methods = { path = "methods" }
system_accounts = { path = "../../work/upstream/lez/lez/system_accounts" }
clock_core = { path = "../../work/upstream/lez/lez/programs/clock/core" }
burn-core = { path = "burn-core" }
redemption-core = { path = "redemption/core" }
risc0-binfmt = "=3.0.6"
chain_state = { path = "../../work/upstream/lez/lez/chain_state" }
common = { path = "../../work/upstream/lez/lez/common" }
programs = { path = "../../work/upstream/lez/lez/programs", features = ["artifacts"] }
fee_core = { path = "../../work/upstream/lez/lez/programs/fee/core" }
lee = { path = "../../work/upstream/lez/lee/state_machine" }
lee_core = { path = "../../work/upstream/lez/lee/state_machine/core", features = ["host"] }
borsh = { version = "1.5.7", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "client"] }

[profile.dev]
debug = 0
[profile.test]
debug = 0

[features]
bridge = ["dep:redemption-actor", "dep:redemption-burn-methods"]
burn-meter = ["bridge", "dep:burn-meter"]
checkpoint = ["dep:checkpoint-methods"]
settlement = ["bridge", "dep:settlement-methods", "dep:bridge_core", "dep:system_upgrader_core", "dep:program_loader_core", "dep:k256"]

[dependencies.settlement-methods]
path = "settlement-methods"
optional = true

[dependencies.bridge_core]
path = "../../work/upstream/lez/lez/programs/bridge/core"
optional = true

[dependencies.system_upgrader_core]
path = "../../work/upstream/lez/lez/programs/system_upgrader/core"
optional = true

[dependencies.program_loader_core]
path = "../../work/upstream/lez/lee/program_loader"
optional = true

[dependencies.k256]
version = "0.13.4"
features = ["schnorr"]
optional = true

[dependencies.checkpoint-methods]
path = "checkpoint-methods"
optional = true

[[bin]]
name = "checkpoint"
path = "src/bin/checkpoint.rs"
required-features = ["checkpoint"]

[[bin]]
name = "checkpoint_cycles"
path = "src/bin/checkpoint_cycles.rs"
required-features = ["checkpoint"]

[[bin]]
name = "block-checkpoint"
path = "src/bin/block_checkpoint.rs"
required-features = ["checkpoint"]

[[bin]]
name = "block-settlement"
path = "src/bin/block_settlement.rs"
required-features = ["settlement"]

[dependencies.redemption-actor]
path = "redemption/actor"
optional = true

[dependencies.redemption-burn-methods]
path = "redemption/burn-methods"
optional = true

[[bin]]
name = "bridge-exits"
path = "src/bin/bridge_exits.rs"
required-features = ["bridge"]

[dependencies.burn-meter]
path = "burn-meter"
optional = true

[[bin]]
name = "burn-meter-check"
path = "src/bin/burn_meter_check.rs"
required-features = ["burn-meter"]
