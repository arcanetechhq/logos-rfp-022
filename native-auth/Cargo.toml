[package]
name = "native-auth"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
logos-blockchain-core = { path = "../../../work/upstream/blockchain/core" }
lb-key-management-system-keys = { package = "logos-blockchain-key-management-system-keys", path = "../../../work/upstream/blockchain/kms/keys" }
lb-cryptarchia-engine = { package = "logos-blockchain-cryptarchia-engine", path = "../../../work/upstream/blockchain/consensus/cryptarchia-engine" }
lb-binary-codec = { package = "logos-blockchain-binary-codec", path = "../../../work/upstream/blockchain/binary-codec" }
lb-ledger = { package = "logos-blockchain-ledger", path = "../../../work/upstream/blockchain/ledger" }
